command:
  template:
    cleanup:
      before:
        is-enabled:
          value: true

      after:
        is-enabled:
          value: false

  filesystem:
    clean:
      exclude:
        targets:
          - filesystem-path:
              value: ${{ root-filesystem-path }}/.venv

      include:
        selection:
          clean-target:
            alias:
              clean-target-1:
              clean-target-2:

            operating-system:
              exclude:
                Windows-x86_64:

              include:
                Linux-x86_64:

            targets:
              - filesystem-path:
                  value: ${{ root-filesystem-path }}/.benchmarks

                pattern:
                  value: ""

  export:
    cleanup:
      before:
        is-enabled:
          value: false

      after:
        is-enabled:
          value: false

    group:
      export-group:
        alias:
          export-group-alias-1:
          export-group-alias-2:

        selection:
          export-selection:

    selection:
      export-selection:
        alias:
          export-selection-alias-1:
          export-selection-alias-2:

        input:    
          include:
            targets:
              - filesystem-path:
                  value: .qlogicae/logis/v3/.gitignore

              - filesystem-path:
                  value: .qlogicae/logis/v3/private/configuration

              - filesystem-path:
                  value: .qlogicae/logis/v3/private/plugin

              - filesystem-path:
                  value: .qlogicae/logis/v3/private/template
                  
              - filesystem-path:
                  value: .qlogicae/logis/v3/public

                pattern:
                  value: ""

          exclude:
            targets:
              - pattern:
                  value: private/temporary

              - pattern:
                  value: __pycache__

        output:
          targets:
            - filesystem-path:
                value: ${{ root-filesystem-path }}/exports

        compression:
          format:
            value: zip

          type:
            value: deflated

          level:
            value: 6

          is-zip-64-allowed:
            value: true

          is-timestamp-strict:
            value: true


cache:
  cleanup:
    before:
      is-enabled:
        value: false

    after:
      is-enabled:
        value: false


time:
  zone:
    value: local


operating-system:
  name:
    value: Linux

  architecture:
    value: x86_64


log:
  is-enabled:
    value: true
    override: false
    
  is-verbose: 
    value: true
    override: false

  default:
    file:
      output:
        is-enabled:
          value: true

  file:      
    is-enabled:
      value: true

    is-verbose: 
      value: true

    targets:
      - filesystem-path:
          value: ${{ root-filesystem-path }}/output.log

  console:
    is-enabled:
      value: false

    is-verbose: 
      value: true


plugin:
  import:
    is-enabled:
      value: true


display:
  console:
    is-enabled:
      value: true

    style:
      reset:
        value: reset

      base-1:
        value: none

      base-2:
        value: grey

      highlight-1:
        value: green

      highlight-2:
        value: green

      maximum-depth:
        value: 6

      is-skipped:
        value: True

      indent-count:
        value: 4

      vertical-count:
        value: 0


macros:
  static:
    value-cache:
      targets:

    file:
      targets:
        main-author-full-name:
          value: John Smith

          alias:
            main-author-full-name-alias-1:
            main-author-full-name-alias-2:
