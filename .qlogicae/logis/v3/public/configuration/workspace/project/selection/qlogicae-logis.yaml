workspace:
  project:
    selection:
      qlogicae-logis:
        filesystem-path:
          value: ${{ qlogicae-logis-selection-project-filesystem-path }}

workflow:
  selection:      
    qlogicae-logis-quality-assurance:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: qlogicae-logis-pre-workflow

        - run:
            value: qlogicae-logis-test-import-references

        - run:
            value: qlogicae-logis-test-type-check

        - run:
            value: qlogicae-logis-test-lint

        - run:
            value: qlogicae-logis-build
            
        - run:
            value: qlogicae-logis-test-pip-deployment

        - run:
            value: qlogicae-logis-archive

        - run:
            value: qlogicae-logis-post-workflow

        # - run:
        #     value: qlogicae-logis-test-benchmark-memory-usage-create

        # - run:
        #     value: qlogicae-logis-test-benchmark-memory-usage-view


    qlogicae-logis-deploy:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run deploy

        - run:
            value: qlogicae-logis-git-deployment

    qlogicae-logis-test-import-references:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-import-references

    qlogicae-logis-test-lint:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-lint
            

    qlogicae-logis-test-unit:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-unit        


    qlogicae-logis-test-benchmark-memory-usage-create:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-benchmark-memory-usage-create


    qlogicae-logis-test-benchmark-memory-usage-view:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-benchmark-memory-usage-view      
          
        # - run:
        #     value: command-filesystem-move        
        #   argument:
        #     source_path: scalene-profile.html
        #     target_path: ${{ qlogicae-logis-output-test-benchmark-filesystem-path }}/scalene-profile.html


    qlogicae-logis-test-type-check:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-type-check


    qlogicae-logis-build:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: command-filesystem-copy          
          argument:
            source_path: qlogicae_logis
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/tmp

        - run:
            value: hatch run minify

        - run:
            value: hatch build

        - run:
            value: command-filesystem-move       
          argument:
            source_path: dist
            target_path: ${{ qlogicae-logis-output-build-release-filesystem-path }}

        - run:
            value: command-filesystem-copy          
          argument:
            source_path: tmp
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/qlogicae_logis
              
    qlogicae-logis-test-pip-deployment:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: hatch run test-pip-deployment


    qlogicae-logis-git-deployment:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: git add .

        - run:
            value: git commit -m "deployment attempt of '${{ qlogicae-logis-current-version-label }}'"
        
        - run:
            value: git tag -a ${{ qlogicae-logis-current-version-label }} -m "deployment attempt of '${{ qlogicae-logis-current-version-label }}'"
        
        - run:
            value: git push
        
        - run:
            value: git push --tags

    qlogicae-logis-pre-workflow:
      filesystem-path:
        value: ${{ root-filesystem-path }}

      scripts:
        - run:
            value: command-filesystem-clean-path
          argument:
            target_paths:
              - qlogicae_logis/__pycache__
              - qlogicae_logis/v3/__pycache__
              - qlogicae_logis/v3/_vendor/__pycache__
              - qlogicae_logis/v3/_vendor/pyyaml/__pycache__
              - qlogicae_logis/v3/_vendor/pyyaml/yaml/__pycache__
              - qlogicae_logis/v3/_vendor/qlogicae_cor/__pycache__
              - qlogicae_logis/v3/_vendor/qlogicae_cor/v2/__pycache__
              - qlogicae_logis/v3/_vendor/qlogicae_cor/v2/library/__pycache__
              - qlogicae_logis/v3/console/__pycache__
              - qlogicae_logis/v3/library/__pycache__
              - qlogicae_logis/v3/project/__pycache__
              - qlogicae_logis/v3/project/configuration/__pycache__
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/dist
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/output
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/test
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/qlogicae_logis

        - run:
            value: pip freeze > requirements.txt

        - run:
            value: command-filesystem-copy          
          argument:
            source_path: requirements.txt
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/requirements.txt

        - run:
            value: command-template-apply        
          argument:
            targets:
              - qlogicae-logis-complex

        - run:
            value: command-filesystem-copy          
          argument:
            source_path: qlogicae_logis
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/qlogicae_logis

        - run:
            value: command-filesystem-copy          
          argument:
            source_path: .qlogicae
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/.qlogicae
              - ${{ qlogicae-ensemble-selection-project-filesystem-path }}/.qlogicae

        - run:
            value: command-filesystem-copy          
          argument:
            source_path: test
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/test

        - run:
            value: command-filesystem-tree-setup          
          argument:
            target_paths:
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/archive
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/${{ qlogicae-logis-output-build-release-filesystem-path }}
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/${{ qlogicae-logis-output-test-unit-filesystem-path }}
              - ${{ qlogicae-logis-selection-project-filesystem-path }}/${{ qlogicae-logis-output-test-benchmark-filesystem-path }}                              

    qlogicae-logis-post-workflow:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:
        - run:
            value: command-filesystem-clean-path
          argument:
            target_paths:
              - tmp


    qlogicae-logis-archive:
      filesystem-path:
        value: ${{ qlogicae-logis-selection-project-filesystem-path }}
        
      scripts:          
        - run:
            value: command-filesystem-copy
          argument:
            source_path: output
            target_paths:
              - ${{ qlogicae-logis-archive-filesystem-path }}

macros:
  static:  
    file:
      targets:
        qlogicae-logis-display-brand-name:
          value: ${{ main-company-display-name }} ${{ qlogicae-logis-display-project-name }}

          alias:
            qldbn:

        qlogicae-logis-base-brand-name:
          value: ${{ main-company-base-name }}-${{ qlogicae-logis-base-project-name }}

        qlogicae-logis-source-brand-name:
          value: ${{ main-company-base-name }}_${{ qlogicae-logis-base-project-name }}

        qlogicae-logis-display-project-name:
          value: Logis

        qlogicae-logis-base-project-name:
          value: logis

        qlogicae-logis-base-description:
          value: The project orchestration tool for QLogicae projects

        qlogicae-logis-current-version-number:
          value: 3.0.12

        qlogicae-logis-active-major-version-number:
          value: 3

        qlogicae-logis-active-major-version-label:
          value: v${{ qlogicae-logis-active-major-version-number }}

        qlogicae-logis-current-version-label:
          value: v${{ qlogicae-logis-current-version-number }}

        qlogicae-logis-base-repository-link:
          value: https://github.com/CedricDeVon/${{ qlogicae-logis-base-brand-name }}

        qlogicae-logis-selection-project-filesystem-path:
          value: ${{ selection-filesystem-path }}/${{ qlogicae-logis-base-brand-name }}

        qlogicae-logis-archive-filesystem-path:
          value: archive/${{ qlogicae-logis-current-version-label }}/${{ current-timestamp }}

        qlogicae-logis-output-filesystem-path:
          value: output

        qlogicae-logis-output-build-release-filesystem-path:
          value: ${{ qlogicae-logis-output-filesystem-path }}/build/release

        qlogicae-logis-output-test-unit-filesystem-path:
          value: ${{ qlogicae-logis-output-filesystem-path }}/test/unit

        qlogicae-logis-output-test-benchmark-filesystem-path:
          value: ${{ qlogicae-logis-output-filesystem-path }}/test/benchmark
