workspace:
  is-enabled:
    value: true

workflow:
  is-enabled:
    value: true

command:
  cache:
    value-cache:
      hide:
        key-path:
          selection:
            targets:
              - key:
                  value: a.b.c

          pattern:
            targets:
              - value: api

  template:
    is-enabled:
      value: true

    cleanup:
      is-enabled:
        value: true

  filesystem:
    clean:
      is-enabled:
        value: true

      default:
        include:
          is-enabled:
            value: true

        exclude:
          is-enabled:
            value: true

      exclude:
        targets:
          - filesystem-path:
              value: ${{ root-filesystem-path }}/.venv

          - filesystem-path:
              value: ${{ root-filesystem-path }}/.benchmarks
              
            pattern:        
              value: "*"

          - filesystem-path:
              value: ${{ root-filesystem-path }}/others

          - filesystem-path:
              value: ${{ root-filesystem-path }}/project

          - filesystem-path:
              value: ${{ root-filesystem-path }}/qlogicae_logis

      include:
        selection:
          root:
            alias:
              ql:

            operating-system:
              # exclude:
              #   Linux-x86_64:

              # include:
              #   Linux-x86_64:

            targets:
              - filesystem-path:
                  value: ${{ root-filesystem-path }}/.benchmarks

                pattern:
                  value: ""

  export: #
    is-enabled:
      value: true

    cleanup:
      is-enabled:
        value: true

    asynchronous:
      is-enabled:
        value: true          

    default:
      filesystem:
        include:
          is-enabled:
            value: true

        exclude:
          is-enabled:
            value: true

      group:
        is-enabled:
          value: true

      selection:
        is-enabled:
          value: true

    group:
      group-1:
        is-enabled:
          value: true

        selection:
          workspace-1:

    selection:
      workspace-1:
        alias:
          ql:

        is-enabled:
          value: true

        input:    
          root-path:
            value: ${{ root-filesystem-path }}

          targets:
            - filesystem-path:
                value: project.code-workspace            

        output:
          filesystem-path:
            value: ${{ root-filesystem-path }}

        compression:
          format:
            value: zip

          type:
            value: deflated

          level:
            value: 6

          is-zip-64-allowed:
            value: true

          is-timestamp-strict:
            value: true

time: ##
  zone:
    value: local

operating-system: ##
  name:
    value: Linux

  architecture:
    value: x86_64

log: ##
  is-enabled:
    value: true
    override: false
    
  is-verbose: 
    value: true
    override: false

  default:
    file:
      output:
        is-enabled:
          value: true

  file:      
    is-enabled:
      value: true

    is-verbose: 
      value: true

    targets:
      # - filesystem-path:
      #     value: a.log

  console:
    is-enabled:
      value: false

    is-verbose: 
      value: true

plugin: ##
  import:
    is-enabled:
      value: true

display: ##
  console:
    is-enabled:
      value: true

    style:
      reset:
        value: reset

      base-1:
        value: none

      base-2:
        value: grey

      highlight-1:
        value: green

      highlight-2:
        value: green

      maximum-depth:
        value: 6

      is-skipped:
        value: True

      indent-count:
        value: 1

      vertical-count:
        value: 0

macros: ##
  static:
    value-cache:
      targets:

    file:
      targets:
        main-author-full-name:
          value: Vaughn Cedric L. Araneta

          alias:
            author:

        main-author-base-email:
          value: vaughncedriclipardoaraneta@gmail.com
        
        main-company-display-name:
          value: QLogicae

        main-company-base-name:
          value: qlogicae
        
        main-company-base-logo-filesystem-path:
          value: ./project/asset/${{ main-company-base-name }}1.png
