name: 'Setup PyPI Package in venv'
description: 'Checkout, set up Python, create venv, install a package from PyPI into it'

inputs:
  python-version:
    description: 'Python version to set up'
    required: true
  source-path:
    description: 'Path to the source folder to copy'
    required: true
  target-path:
    description: 'Path to the target working directory to copy into'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Virtual Environment
      shell: bash
      run: python3 -m venv .venv

    - name: Install Package
      shell: bash
      run: |
        source .venv/bin/activate
        pip install qlogicae-logis

    - name: Setup Template
      shell: bash
      run: |
        mkdir -p "${{ inputs.target-path }}"
        cp -r "${{ inputs.source-path }}/." "${{ inputs.target-path }}/"

    - name: Add venv to PATH
      shell: bash
      run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"


