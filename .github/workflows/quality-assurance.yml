          - command: "qlogicae-logis template list selections"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/list/selections/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

          - command: "qlogicae-logis template apply -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis template apply --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"
          
          - command: "qlogicae-logis template apply"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/empty"
