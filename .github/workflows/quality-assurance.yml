name: Quality Assurance
permissions:
  contents: read
  pull-requests: write

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  pypi-package-upload-wait:
    if: true
    name: "PyPi Package Upload | Wait"
    runs-on: ubuntu-latest
    steps:
      - name: Forced Delay
        run: sleep 30


  v3-e2e-testing-command:
    if: false
    name: "Python ${{ matrix.python-version }} | V3 | E2E Testing | Command | '${{ matrix.targets.command }}'"
    runs-on: ubuntu-latest
    needs: pypi-package-upload-wait

    defaults:
      run:
        working-directory: ${{ matrix.targets.working-directory }}

    strategy:
      fail-fast: false

      matrix:
        targets:
          - command: "qlogicae-logis -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/root/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/root/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

        python-version:
          - "3.14"
          - "3.13"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/setup-e2e-testing-environment
        with:
          python-version: ${{ matrix.python-version }}
          source-path: ${{ matrix.targets.template-directory }}
          target-path: ${{ matrix.targets.working-directory }}

      - name: Run '${{ matrix.targets.command }}' Command
        run: ${{ matrix.targets.command }}


  v3-e2e-testing-command-about:
    if: false
    name: "Python ${{ matrix.python-version }} | V3 | E2E Testing | Command | '${{ matrix.targets.command }}'"
    runs-on: ubuntu-latest
    needs: pypi-package-upload-wait

    defaults:
      run:
        working-directory: ${{ matrix.targets.working-directory }}

    strategy:
      fail-fast: false

      matrix:
        targets:
          - command: "qlogicae-logis about -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about version -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about version --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about version -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about version --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis about version"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis about version"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/about/version/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

        python-version:
          - "3.14"
          - "3.13"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/setup-e2e-testing-environment
        with:
          python-version: ${{ matrix.python-version }}
          source-path: ${{ matrix.targets.template-directory }}
          target-path: ${{ matrix.targets.working-directory }}

      - name: Run '${{ matrix.targets.command }}' Command
        run: ${{ matrix.targets.command }}


  v3-e2e-testing-command-workflow:
    if: false
    name: "Python ${{ matrix.python-version }} | V3 | E2E Testing | Command | '${{ matrix.targets.command }}'"
    runs-on: ubuntu-latest
    needs: pypi-package-upload-wait

    defaults:
