          - command: "qlogicae-logis template list --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/list/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis template list selections -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/list/suite/help"
