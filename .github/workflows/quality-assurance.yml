          - command: "qlogicae-logis template -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis template --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis template list -h"
