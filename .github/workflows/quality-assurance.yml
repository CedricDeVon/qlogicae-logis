            template-directory: "./test/qlogicae_logis/v3/template/common"

          - command: "qlogicae-logis template apply -t demo-project-1"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis template apply -t demo-project-1"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

          - command: "qlogicae-logis template apply --target demo-project-1"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis template apply --target demo-project-1"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/template/apply/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

        python-version:
          - "3.14"
          - "3.13"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/setup-e2e-testing-environment
        with:
          python-version: ${{ matrix.python-version }}
          source-path: ${{ matrix.targets.template-directory }}
          target-path: ${{ matrix.targets.working-directory }}

      - name: Run '${{ matrix.targets.command }}' Command
        run: ${{ matrix.targets.command }}


  
  v3-e2e-testing-command-debug:
    if: false
    name: "Python ${{ matrix.python-version }} | V3 | E2E Testing | Command | '${{ matrix.targets.command }}'"
    runs-on: ubuntu-latest
    needs: pypi-package-upload-wait

    defaults:
