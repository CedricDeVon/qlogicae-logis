          - command: "qlogicae-logis workflow list -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow list --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow list selections -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow list selections --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/selections/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow list selections"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/selections/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis workflow list selections"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/list/selections/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

          - command: "qlogicae-logis workflow run -h"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow run --help"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/help"
            template-directory: "./test/qlogicae_logis/v3/template/help"

          - command: "qlogicae-logis workflow run -t demo-workflow-main-group"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis workflow run -t demo-workflow-main-group"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

          - command: "qlogicae-logis workflow run --target demo-workflow-main-group"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/empty"
            template-directory: "./test/qlogicae_logis/v3/template/empty"

          - command: "qlogicae-logis workflow run --target demo-workflow-main-group"
            working-directory: "./test/qlogicae_logis/v3/e2e/github/actions/command/workflow/run/suite/common"
            template-directory: "./test/qlogicae_logis/v3/template/common"

        python-version:
          - "3.14"
          - "3.13"
          - "3.12"

    steps:
      - uses: actions/checkout@v4
      
      - uses: ./.github/actions/setup-e2e-testing-environment
        with:
          python-version: ${{ matrix.python-version }}
          source-path: ${{ matrix.targets.template-directory }}
          target-path: ${{ matrix.targets.working-directory }}

      - name: Run '${{ matrix.targets.command }}' Command
        run: ${{ matrix.targets.command }}


  v3-e2e-testing-command-template:
    if: false
    name: "Python ${{ matrix.python-version }} | V3 | E2E Testing | Command | '${{ matrix.targets.command }}'"
    runs-on: ubuntu-latest
    needs: pypi-package-upload-wait

    defaults:
