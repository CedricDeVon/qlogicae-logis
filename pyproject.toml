[project]
name = "qlogicae-logis"
version = "3.1.10"
description = "The project orchestration tool for QLogicae projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = []
keywords = [
    "qlogicae",
    "logis"
]
classifiers = [
    "Typing :: Typed",
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
maintainers = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "safety",
    "pip-audit",   
]

[project.scripts]
qlogicae-logis = "qlogicae_logis.v3.console.app:main"


[project.urls]
Homepage = "https://github.com/CedricDeVon/qlogicae-logis"
Repository = "https://github.com/CedricDeVon/qlogicae-logis"
Documentation = "https://github.com/CedricDeVon/qlogicae-logis"
Issues = "https://github.com/CedricDeVon/qlogicae-logis/issues"
Changelog = "https://github.com/CedricDeVon/qlogicae-logis/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]
python_files = [
    "test_*.py"
]
addopts = "-ra"


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "qlogicae_logis/**/*",
    "qlogicae_logis/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
    "qlogicae_logis/v3/_vendor",
]

[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false

[tool.mypy]
files = [
    "qlogicae_logis/v3",
]
exclude = [
    '(^|/)_vendor(/|$)',
]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "qlogicae_logis.v3._vendor.*",
]
ignore_errors = true

[tool.vulture]
exclude = [
    "qlogicae_logis/v3/_vendor/qlogicae_cor/v2/library/log_format.py",
    "qlogicae_logis/v3/_vendor/qlogicae_cor/v2/library/timestamp_manager.py",
]

[tool.hatch.build.targets.wheel]
packages = [
    "qlogicae_logis"
]

[tool.hatch.build.targets.wheel.force-include]
"qlogicae_logis/py.typed" = "qlogicae_logis/py.typed"

[tool.hatch.envs.default.scripts]
development-cleanup-filesystem = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" \
        dist \
        temporary
"""

development-setup-filesystem = """
    python3 -c "import pathlib,sys; [pathlib.Path(p).mkdir(parents=True, exist_ok=True) for p in sys.argv[1:]]" \
        temporary/build/release/dist \
        temporary/build/release/source/qlogicae_logis \
        temporary/build/release/minified/qlogicae_logis \
        temporary/result
"""

build-trim-source = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" \
        qlogicae_logis/__pycache__ \
        qlogicae_logis/v3/__pycache__ \
        qlogicae_logis/v3/_vendor/__pycache__ \
        qlogicae_logis/v3/_vendor/pyyaml/__pycache__ \
        qlogicae_logis/v3/_vendor/pyyaml/yaml/__pycache__ \
        qlogicae_logis/v3/_vendor/qlogicae_cor/__pycache__ \
        qlogicae_logis/v3/_vendor/qlogicae_cor/v2/__pycache__ \
        qlogicae_logis/v3/_vendor/qlogicae_cor/v2/library/__pycache__ \
        qlogicae_logis/v3/console/__pycache__ \
        qlogicae_logis/v3/library/__pycache__ \
        qlogicae_logis/v3/project/__pycache__ \
        qlogicae_logis/v3/project/configuration/__pycache__
"""

development-clean-environment = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" \
        dist \
        test \
        output
"""

development-synchronize-dependencies = """
    pip \
        freeze > requirements.txt
"""

development-install-dependencies = """
    pip \
        install -r requirements.txt
"""

build-source = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        qlogicae_logis \
        temporary/build/release/source/qlogicae_logis
"""

pre-build-minified = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        qlogicae_logis \
        temporary/build/release/minified/qlogicae_logis
"""

build-minified = """
    pyminify \
        --in-place \
        --prefer-single-line \
        --remove-debug \
        --remove-asserts \
        --remove-literal-statements \
        --remove-class-attribute-annotations \
        temporary/build/release/minified/qlogicae_logis
"""

pre-build-pip-package-1 = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" \
        qlogicae_logis
"""

pre-build-pip-package-2 = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        temporary/build/release/minified/qlogicae_logis \
        qlogicae_logis
"""

build-pip-package = """
    hatch \
        build 
"""

post-build-pip-package-1 = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        temporary/build/release/source/qlogicae_logis \
        qlogicae_logis
"""

post-build-pip-package-2 = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        dist \
        temporary/build/release/dist
"""

archive-outputs = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" \
        temporary archive/v3.1.10/2026-09-10T20-17-41.456554442+08-00
"""

test-dead-code = """
    vulture \
        qlogicae_logis 2>&1 | \
        python3 -c "import sys; data=sys.stdin.read(); sys.stdout.write(data); [open(p,'w').write(data) for p in sys.argv[1:]]" temporary/result/test-dead-code.txt
"""

test-package-dependency-security = """
    pip-audit \
        -r requirements.txt \
        -f json -o temporary/result/test-package-dependency.json
"""

test-static-code-analysis-security = """
    bandit \
        -r qlogicae_logis \
        -f json -o temporary/result/test-static-code-analysis.json
"""

test-hardcoded-secrets-security = """
    detect-secrets scan > \
        temporary/result/test-hardcoded-secrets.json
"""

test-lint = """
    ruff \
        check qlogicae_logis/v3/console qlogicae_logis/v3/library --fix  2>&1 | \
        python3 -c "import sys; data=sys.stdin.read(); sys.stdout.write(data); [open(p,'w').write(data) for p in sys.argv[1:]]" temporary/result/test-lint.txt 
"""

test-type-check = """
    mypy 2>&1 | \
        python3 -c "import sys; data=sys.stdin.read(); sys.stdout.write(data); [open(p,'w').write(data) for p in sys.argv[1:]]" \
        temporary/result/test-type-check.txt 
"""

test-pip-package = """
    twine check --strict temporary/build/release/dist/* 2>&1 | \
        python3 -c "import sys; data=sys.stdin.read(); sys.stdout.write(data); [open(p,'w').write(data) for p in sys.argv[1:]]" \
        temporary/result/test-pip-package.txt
"""

deploy-release = """
    twine \
        upload temporary/build/release/dist/* \
        --config-file .pypirc
"""

github-workflow-setup = """
    mkdir -p temporary/build/release
"""

github-workflow-test-dead-code = """
    hatch run github-workflow-setup &&
    hatch run test-dead-code
"""

github-workflow-test-type-check = """
    hatch run github-workflow-setup &&
    hatch run test-type-check
"""

github-workflow-test-lint = """
    hatch run github-workflow-setup &&
    hatch run test-lint
"""

